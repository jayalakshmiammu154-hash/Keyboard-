name: Build Neon Keys APK

on:
  workflow_dispatch:
  push:
    paths:
      - "NeonKeysAndroid.zip"
      - ".github/workflows/android.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

            
      
              
      - name: Accept Android SDK licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          touch "$ANDROID_HOME/licenses/android-sdk-license"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          
        
  
        
      - name: Install Android SDK packages
        run: |
           "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project
        run: unzip -q NeonKeysAndroid.zip -d project

      - name: Build debug APK
        working-directory: project
        run: gradle assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeonKeys-debug-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
